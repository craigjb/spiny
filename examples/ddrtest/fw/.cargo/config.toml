[target.riscv32i-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tpac.x",
    "-C", "link-arg=-Tdevice.x",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x"
]
runner = 'probe-rs run --chip-description-path probe_rs.yaml --chip=SpinySoC'

[build]
target = "riscv32i-unknown-none-elf"

[env]
DEFMT_RTT_BUFFER_SIZE = "512"
