# ==============================================================================
# LiteDRAM DDR2 Initialization Script
# Use with Digilent Nexys A7 100T
# ==============================================================================

# 1. CONFIGURATION
# ------------------------------------------------------------------------------
set CSR_BASE 0x10010000

# 2. ADDRESS MAP
# ------------------------------------------------------------------------------
set CSR_DDRCTRL_INIT_DONE_ADDR        [expr {$CSR_BASE + 0x0000}]
set CSR_DDRCTRL_INIT_ERROR_ADDR       [expr {$CSR_BASE + 0x0004}]

# PHY Hardware Config
set CSR_DDRPHY_RST_ADDR               [expr {$CSR_BASE + 0x0800}]
set CSR_DDRPHY_DLY_SEL_ADDR           [expr {$CSR_BASE + 0x0804}]
set CSR_DDRPHY_RDLY_DQ_RST_ADDR       [expr {$CSR_BASE + 0x0814}]
set CSR_DDRPHY_RDLY_DQ_INC_ADDR       [expr {$CSR_BASE + 0x0818}]
set CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR [expr {$CSR_BASE + 0x081c}]
set CSR_DDRPHY_RDPHASE_ADDR           [expr {$CSR_BASE + 0x082c}]
set CSR_DDRPHY_WRPHASE_ADDR           [expr {$CSR_BASE + 0x0830}]

# DFI Interface
set CSR_SDRAM_DFII_CONTROL_ADDR       [expr {$CSR_BASE + 0x1000}]
set CSR_SDRAM_DFII_PI0_COMMAND_ADDR   [expr {$CSR_BASE + 0x1004}]
set CSR_SDRAM_DFII_PI0_COMMAND_ISSUE  [expr {$CSR_BASE + 0x1008}]
set CSR_SDRAM_DFII_PI0_ADDRESS_ADDR   [expr {$CSR_BASE + 0x100c}]
set CSR_SDRAM_DFII_PI0_BADDRESS_ADDR  [expr {$CSR_BASE + 0x1010}]

# 3. BIT DEFINITIONS
# ------------------------------------------------------------------------------
set DFII_CONTROL_SEL     0x01
set DFII_CONTROL_CKE     0x02
set DFII_CONTROL_ODT     0x04
set DFII_CONTROL_RESET_N 0x08

# Commands
set CMD_CS  0x01
set CMD_WE  0x02
set CMD_CAS 0x04
set CMD_RAS 0x08

set CMD_PRECHARGE [expr {$CMD_RAS | $CMD_WE | $CMD_CS}]
set CMD_LMR       [expr {$CMD_RAS | $CMD_CAS | $CMD_WE | $CMD_CS}]
set CMD_REFRESH   [expr {$CMD_RAS | $CMD_CAS | $CMD_CS}]
set CMD_ZQCAL     [expr {$CMD_WE | $CMD_CS}]

# 4. HELPER PROCS
# ------------------------------------------------------------------------------
proc write_addr {val} {
    global CSR_SDRAM_DFII_PI0_ADDRESS_ADDR
    mww $CSR_SDRAM_DFII_PI0_ADDRESS_ADDR $val
}

proc write_baddr {val} {
    global CSR_SDRAM_DFII_PI0_BADDRESS_ADDR
    mww $CSR_SDRAM_DFII_PI0_BADDRESS_ADDR $val
}

proc command_p0 {cmd} {
    global CSR_SDRAM_DFII_PI0_COMMAND_ADDR
    global CSR_SDRAM_DFII_PI0_COMMAND_ISSUE
    mww $CSR_SDRAM_DFII_PI0_COMMAND_ADDR $cmd
    mww $CSR_SDRAM_DFII_PI0_COMMAND_ISSUE 1
}

# 5. INITIALIZATION SEQUENCE
# ------------------------------------------------------------------------------
proc init_sequence {} {
    global CSR_SDRAM_DFII_CONTROL_ADDR CSR_DDRCTRL_INIT_DONE_ADDR
    global CSR_DDRCTRL_INIT_ERROR_ADDR
    global CSR_DDRPHY_RST_ADDR CSR_DDRPHY_RDPHASE_ADDR CSR_DDRPHY_WRPHASE_ADDR
    global DFII_CONTROL_SEL DFII_CONTROL_CKE DFII_CONTROL_ODT DFII_CONTROL_RESET_N
    global CMD_PRECHARGE CMD_LMR CMD_REFRESH CMD_ZQCAL

    puts "DRAM PHY INIT: Reset read and write phases"
    mww $CSR_DDRPHY_RDPHASE_ADDR 2
    mww $CSR_DDRPHY_WRPHASE_ADDR 3

    puts "DRAM INIT: Switch DFII to software control"
    set val [expr {$DFII_CONTROL_CKE | $DFII_CONTROL_ODT | $DFII_CONTROL_RESET_N}]
    mww $CSR_SDRAM_DFII_CONTROL_ADDR $val

    puts "DRAM INIT: Reset PHY"
    mww $CSR_DDRPHY_RST_ADDR 1
    sleep 1
    mww $CSR_DDRPHY_RST_ADDR 0
    sleep 1

    puts "DRAM INIT: Reset init and error flags"
    mww $CSR_DDRCTRL_INIT_DONE_ADDR 0
    mww $CSR_DDRCTRL_INIT_ERROR_ADDR 0

    puts "DRAM INIT: Bring CKE high"
    write_addr 0x0
    write_baddr 0
    set val [expr {$DFII_CONTROL_CKE | $DFII_CONTROL_ODT | $DFII_CONTROL_RESET_N}]
    mww $CSR_SDRAM_DFII_CONTROL_ADDR $val
    sleep 20 ;# cdelay(20000)

    puts "DRAM INIT: Load Mode Register 2, CWL=5"
    write_addr 0x200
    write_baddr 2
    command_p0 $CMD_LMR

    puts "DRAM INIT: Load Mode Register 3"
    write_addr 0x0
    write_baddr 3
    command_p0 $CMD_LMR

    puts "DRAM INIT: Load Mode Register 1"
    write_addr 0x6
    write_baddr 1
    command_p0 $CMD_LMR

    puts "DRAM INIT: Load Mode Register 0, CL=7, BL=8"
    write_addr 0x930
    write_baddr 0
    command_p0 $CMD_LMR
    sleep 1

    puts "DRAM INIT: ZQ Calibration"
    write_addr 0x400
    write_baddr 0
    command_p0 $CMD_ZQCAL
    sleep 1

    puts "DRAM INIT: Switch DFII to Hardware Control"
    mww $CSR_SDRAM_DFII_CONTROL_ADDR $DFII_CONTROL_SEL

    puts "DRAM INIT: Set Init Done Flag"
    mww $CSR_DDRCTRL_INIT_DONE_ADDR 1

    puts "--- DRAM INIT COMPLETE ---"
}

init_sequence
