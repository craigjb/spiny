# ==============================================================================
# LiteDRAM DDR3 Initialization + Read Leveling Script
# Use with Digilent Nexys Video
# ==============================================================================

# 1. CONFIGURATION
# ------------------------------------------------------------------------------
set CSR_BASE 0x10010000

# PHY parameters (from sdram_phy.h)
set NUM_MODULES  2
set NUM_BITSLIPS 8
set NUM_DELAYS   32
set NUM_PHASES   4
set RDPHASE      2
set WRPHASE      3

# 2. ADDRESS MAP
# ------------------------------------------------------------------------------
set CSR_DDRCTRL_INIT_DONE_ADDR        [expr {$CSR_BASE + 0x0000}]
set CSR_DDRCTRL_INIT_ERROR_ADDR       [expr {$CSR_BASE + 0x0004}]

# PHY Hardware Config
set CSR_DDRPHY_RST_ADDR               [expr {$CSR_BASE + 0x0800}]
set CSR_DDRPHY_DLY_SEL_ADDR           [expr {$CSR_BASE + 0x0804}]
set CSR_DDRPHY_RDLY_DQ_RST_ADDR       [expr {$CSR_BASE + 0x0814}]
set CSR_DDRPHY_RDLY_DQ_INC_ADDR       [expr {$CSR_BASE + 0x0818}]
set CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR [expr {$CSR_BASE + 0x081c}]
set CSR_DDRPHY_RDLY_DQ_BITSLIP_ADDR   [expr {$CSR_BASE + 0x0820}]
set CSR_DDRPHY_RDPHASE_ADDR           [expr {$CSR_BASE + 0x082c}]
set CSR_DDRPHY_WRPHASE_ADDR           [expr {$CSR_BASE + 0x0830}]

# DFI Interface - Phase 0
set CSR_DFII_CONTROL_ADDR             [expr {$CSR_BASE + 0x1000}]
set CSR_DFII_PI0_COMMAND_ADDR         [expr {$CSR_BASE + 0x1004}]
set CSR_DFII_PI0_COMMAND_ISSUE        [expr {$CSR_BASE + 0x1008}]
set CSR_DFII_PI0_ADDRESS_ADDR         [expr {$CSR_BASE + 0x100c}]
set CSR_DFII_PI0_BADDRESS_ADDR        [expr {$CSR_BASE + 0x1010}]
set CSR_DFII_PI0_WRDATA_ADDR          [expr {$CSR_BASE + 0x1014}]
set CSR_DFII_PI0_RDDATA_ADDR          [expr {$CSR_BASE + 0x1018}]

# DFI Interface - Phase 1
set CSR_DFII_PI1_COMMAND_ADDR         [expr {$CSR_BASE + 0x101c}]
set CSR_DFII_PI1_COMMAND_ISSUE        [expr {$CSR_BASE + 0x1020}]
set CSR_DFII_PI1_ADDRESS_ADDR         [expr {$CSR_BASE + 0x1024}]
set CSR_DFII_PI1_BADDRESS_ADDR        [expr {$CSR_BASE + 0x1028}]
set CSR_DFII_PI1_WRDATA_ADDR          [expr {$CSR_BASE + 0x102c}]
set CSR_DFII_PI1_RDDATA_ADDR          [expr {$CSR_BASE + 0x1030}]

# DFI Interface - Phase 2
set CSR_DFII_PI2_COMMAND_ADDR         [expr {$CSR_BASE + 0x1034}]
set CSR_DFII_PI2_COMMAND_ISSUE        [expr {$CSR_BASE + 0x1038}]
set CSR_DFII_PI2_ADDRESS_ADDR         [expr {$CSR_BASE + 0x103c}]
set CSR_DFII_PI2_BADDRESS_ADDR        [expr {$CSR_BASE + 0x1040}]
set CSR_DFII_PI2_WRDATA_ADDR          [expr {$CSR_BASE + 0x1044}]
set CSR_DFII_PI2_RDDATA_ADDR          [expr {$CSR_BASE + 0x1048}]

# DFI Interface - Phase 3
set CSR_DFII_PI3_COMMAND_ADDR         [expr {$CSR_BASE + 0x104c}]
set CSR_DFII_PI3_COMMAND_ISSUE        [expr {$CSR_BASE + 0x1050}]
set CSR_DFII_PI3_ADDRESS_ADDR         [expr {$CSR_BASE + 0x1054}]
set CSR_DFII_PI3_BADDRESS_ADDR        [expr {$CSR_BASE + 0x1058}]
set CSR_DFII_PI3_WRDATA_ADDR          [expr {$CSR_BASE + 0x105c}]
set CSR_DFII_PI3_RDDATA_ADDR          [expr {$CSR_BASE + 0x1060}]

# Phase register arrays (indexed by phase number)
set DFII_PIX_COMMAND_ADDR [list \
    $CSR_DFII_PI0_COMMAND_ADDR $CSR_DFII_PI1_COMMAND_ADDR \
    $CSR_DFII_PI2_COMMAND_ADDR $CSR_DFII_PI3_COMMAND_ADDR]
set DFII_PIX_COMMAND_ISSUE [list \
    $CSR_DFII_PI0_COMMAND_ISSUE $CSR_DFII_PI1_COMMAND_ISSUE \
    $CSR_DFII_PI2_COMMAND_ISSUE $CSR_DFII_PI3_COMMAND_ISSUE]
set DFII_PIX_ADDRESS_ADDR [list \
    $CSR_DFII_PI0_ADDRESS_ADDR $CSR_DFII_PI1_ADDRESS_ADDR \
    $CSR_DFII_PI2_ADDRESS_ADDR $CSR_DFII_PI3_ADDRESS_ADDR]
set DFII_PIX_BADDRESS_ADDR [list \
    $CSR_DFII_PI0_BADDRESS_ADDR $CSR_DFII_PI1_BADDRESS_ADDR \
    $CSR_DFII_PI2_BADDRESS_ADDR $CSR_DFII_PI3_BADDRESS_ADDR]
set DFII_PIX_WRDATA_ADDR [list \
    $CSR_DFII_PI0_WRDATA_ADDR $CSR_DFII_PI1_WRDATA_ADDR \
    $CSR_DFII_PI2_WRDATA_ADDR $CSR_DFII_PI3_WRDATA_ADDR]
set DFII_PIX_RDDATA_ADDR [list \
    $CSR_DFII_PI0_RDDATA_ADDR $CSR_DFII_PI1_RDDATA_ADDR \
    $CSR_DFII_PI2_RDDATA_ADDR $CSR_DFII_PI3_RDDATA_ADDR]

# 3. BIT DEFINITIONS
# ------------------------------------------------------------------------------
set DFII_CONTROL_SEL     0x01
set DFII_CONTROL_CKE     0x02
set DFII_CONTROL_ODT     0x04
set DFII_CONTROL_RESET_N 0x08

# Commands
set CMD_CS      0x01
set CMD_WE      0x02
set CMD_CAS     0x04
set CMD_RAS     0x08
set CMD_WRDATA  0x10
set CMD_RDDATA  0x20

set CMD_PRECHARGE [expr {$CMD_RAS | $CMD_WE | $CMD_CS}]
set CMD_LMR       [expr {$CMD_RAS | $CMD_CAS | $CMD_WE | $CMD_CS}]
set CMD_REFRESH   [expr {$CMD_RAS | $CMD_CAS | $CMD_CS}]
set CMD_ZQCAL     [expr {$CMD_WE | $CMD_CS}]

# 4. HELPER PROCS
# ------------------------------------------------------------------------------
proc command_px {phase cmd} {
    global DFII_PIX_COMMAND_ADDR DFII_PIX_COMMAND_ISSUE
    mww [lindex $DFII_PIX_COMMAND_ADDR $phase] $cmd
    mww [lindex $DFII_PIX_COMMAND_ISSUE $phase] 1
}

proc command_p0 {cmd} {
    command_px 0 $cmd
}

proc command_pwr {cmd} {
    global WRPHASE
    command_px $WRPHASE $cmd
}

proc command_prd {cmd} {
    global RDPHASE
    command_px $RDPHASE $cmd
}

proc write_addr {val} {
    global CSR_DFII_PI0_ADDRESS_ADDR
    mww $CSR_DFII_PI0_ADDRESS_ADDR $val
}

proc write_baddr {val} {
    global CSR_DFII_PI0_BADDRESS_ADDR
    mww $CSR_DFII_PI0_BADDRESS_ADDR $val
}

# 32-bit Galois LFSR (matches LiteDRAM's lfsr.h)
# Taps for 32 bits: 0x80200003
proc lfsr32 {prev} {
    set lsb [expr {$prev & 1}]
    set prev [expr {($prev >> 1) & 0x7FFFFFFF}]
    if {$lsb} {
        set prev [expr {$prev ^ 0x80200003}]
    }
    return $prev
}

# Generate PRNG test pattern for all phases
# Returns list of NUM_PHASES 32-bit words
proc generate_pattern {seed} {
    global NUM_PHASES
    set prv $seed
    set pattern [list]
    for {set p 0} {$p < $NUM_PHASES} {incr p} {
        set word 0
        for {set bit 0} {$bit < 32} {incr bit} {
            set prv [lfsr32 $prv]
            set word [expr {$word | (($prv & 1) << $bit)}]
        }
        lappend pattern $word
    }
    return $pattern
}

# popcount - count set bits in a 32-bit value
proc popcount {x} {
    set count 0
    set x [expr {$x & 0xFFFFFFFF}]
    while {$x != 0} {
        set count [expr {$count + ($x & 1)}]
        set x [expr {($x >> 1) & 0x7FFFFFFF}]
    }
    return $count
}

# 5. DFI WRITE/READ CHECK
# ------------------------------------------------------------------------------
# Write test pattern to DRAM via DFI, read back, count bit errors for a module.
# Must be called while DFII is in software control mode.
proc dfi_write_read_check {module seed} {
    global DFII_PIX_WRDATA_ADDR DFII_PIX_RDDATA_ADDR
    global DFII_PIX_ADDRESS_ADDR DFII_PIX_BADDRESS_ADDR
    global NUM_PHASES WRPHASE RDPHASE
    global CMD_RAS CMD_CAS CMD_WE CMD_CS CMD_WRDATA CMD_RDDATA

    set pattern [generate_pattern $seed]

    # Activate row 0, bank 0
    mww [lindex $DFII_PIX_ADDRESS_ADDR 0] 0
    mww [lindex $DFII_PIX_BADDRESS_ADDR 0] 0
    command_p0 [expr {$CMD_RAS | $CMD_CS}]

    # Write: load pattern into phase write-data registers
    for {set p 0} {$p < $NUM_PHASES} {incr p} {
        mww [lindex $DFII_PIX_WRDATA_ADDR $p] [lindex $pattern $p]
    }
    mww [lindex $DFII_PIX_ADDRESS_ADDR $WRPHASE] 0
    mww [lindex $DFII_PIX_BADDRESS_ADDR $WRPHASE] 0
    command_pwr [expr {$CMD_CAS | $CMD_WE | $CMD_CS | $CMD_WRDATA}]

    # Read: issue read command
    mww [lindex $DFII_PIX_ADDRESS_ADDR $RDPHASE] 0
    mww [lindex $DFII_PIX_BADDRESS_ADDR $RDPHASE] 0
    command_prd [expr {$CMD_CAS | $CMD_CS | $CMD_RDDATA}]

    # Precharge
    mww [lindex $DFII_PIX_ADDRESS_ADDR 0] 0
    mww [lindex $DFII_PIX_BADDRESS_ADDR 0] 0
    command_p0 [expr {$CMD_RAS | $CMD_WE | $CMD_CS}]

    # Compare: check this module's bytes in each phase
    # Each 32-bit phase register holds 2 DDR beats of 16 bits:
    #   bits [15:0]  = positive edge (beat N)
    #   bits [31:16] = negative edge (beat N+1)
    # Module 0 (DQ[7:0]) mask: 0x00FF00FF
    # Module 1 (DQ[15:8]) mask: 0xFF00FF00
    set mask [expr {$module == 0 ? 0x00FF00FF : 0xFF00FF00}]

    set errors 0
    for {set p 0} {$p < $NUM_PHASES} {incr p} {
        set rddata [read_memory [lindex $DFII_PIX_RDDATA_ADDR $p] 32 1]
        set expected [lindex $pattern $p]
        set diff [expr {($rddata ^ $expected) & $mask}]
        set errors [expr {$errors + [popcount $diff]}]
    }

    return $errors
}

# Run test with multiple seeds for robustness (matches LiteDRAM)
proc run_test_pattern {module} {
    set seeds [list 42 84 36]
    set total_errors 0
    foreach seed $seeds {
        set total_errors [expr {$total_errors + [dfi_write_read_check $module $seed]}]
    }
    return $total_errors
}

# 6. READ LEVELING
# ------------------------------------------------------------------------------

# Switch DFII to software control mode
proc dfii_sw_control {} {
    global CSR_DFII_CONTROL_ADDR
    global DFII_CONTROL_CKE DFII_CONTROL_ODT DFII_CONTROL_RESET_N
    mww $CSR_DFII_CONTROL_ADDR \
        [expr {$DFII_CONTROL_CKE | $DFII_CONTROL_ODT | $DFII_CONTROL_RESET_N}]
}

# Switch DFII to hardware control mode
proc dfii_hw_control {} {
    global CSR_DFII_CONTROL_ADDR
    global DFII_CONTROL_SEL DFII_CONTROL_CKE DFII_CONTROL_ODT DFII_CONTROL_RESET_N
    mww $CSR_DFII_CONTROL_ADDR \
        [expr {$DFII_CONTROL_SEL | $DFII_CONTROL_CKE | $DFII_CONTROL_ODT | $DFII_CONTROL_RESET_N}]
}

# Scan all delays for current bitslip, return score
proc scan_module {module} {
    global CSR_DDRPHY_RDLY_DQ_RST_ADDR CSR_DDRPHY_RDLY_DQ_INC_ADDR
    global NUM_DELAYS

    set max_errors 96 ;# 3 seeds * 32 bits per phase check
    set score 0

    mww $CSR_DDRPHY_RDLY_DQ_RST_ADDR 1

    for {set tap 0} {$tap < $NUM_DELAYS} {incr tap} {
        set errors [run_test_pattern $module]
        set working [expr {$errors == 0}]
        set score [expr {$score + ($working * $max_errors * $NUM_DELAYS) + ($max_errors - $errors)}]
        mww $CSR_DDRPHY_RDLY_DQ_INC_ADDR 1
    }

    return $score
}

# Find working delay window and set to center
proc center_module {module} {
    global CSR_DDRPHY_RDLY_DQ_RST_ADDR CSR_DDRPHY_RDLY_DQ_INC_ADDR
    global NUM_DELAYS

    mww $CSR_DDRPHY_RDLY_DQ_RST_ADDR 1

    # Find first working delay (require 2 consecutive working taps)
    set delay_min -1
    set last_working 0
    for {set tap 0} {$tap < $NUM_DELAYS} {incr tap} {
        set errors [run_test_pattern $module]
        set working [expr {$errors == 0}]
        if {$working && $last_working && $delay_min < 0} {
            set delay_min [expr {$tap - 1}]
            break
        }
        set last_working $working
        mww $CSR_DDRPHY_RDLY_DQ_INC_ADDR 1
    }

    if {$delay_min < 0} {
        puts "    WARNING: no working delay window found!"
        return
    }

    # Find last working delay
    set delay_max $delay_min
    for {set tap [expr {$delay_min + 2}]} {$tap < $NUM_DELAYS} {incr tap} {
        set errors [run_test_pattern $module]
        set working [expr {$errors == 0}]
        if {$working} {
            set delay_max $tap
        } else {
            break
        }
        mww $CSR_DDRPHY_RDLY_DQ_INC_ADDR 1
    }

    # Set delay to midpoint
    set mid [expr {($delay_min + $delay_max) / 2}]
    puts [format "    delay window: %d-%d, center: %d" $delay_min $delay_max $mid]

    mww $CSR_DDRPHY_RDLY_DQ_RST_ADDR 1
    for {set i 0} {$i < $mid} {incr i} {
        mww $CSR_DDRPHY_RDLY_DQ_INC_ADDR 1
    }
}

# Main read leveling procedure
proc read_leveling {} {
    global CSR_DDRPHY_DLY_SEL_ADDR
    global CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR CSR_DDRPHY_RDLY_DQ_BITSLIP_ADDR
    global NUM_MODULES NUM_BITSLIPS

    puts "READ LEVELING: Starting..."
    dfii_sw_control

    for {set module 0} {$module < $NUM_MODULES} {incr module} {
        puts "  Module $module:"
        mww $CSR_DDRPHY_DLY_SEL_ADDR [expr {1 << $module}]

        # Sweep bitslips, score each by scanning all delays
        set best_score 0
        set best_bitslip 0

        mww $CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR 1

        for {set bitslip 0} {$bitslip < $NUM_BITSLIPS} {incr bitslip} {
            set score [scan_module $module]
            puts [format "    bitslip %d: score %d" $bitslip $score]

            if {$score > $best_score} {
                set best_score $score
                set best_bitslip $bitslip
            }

            if {$bitslip < [expr {$NUM_BITSLIPS - 1}]} {
                mww $CSR_DDRPHY_RDLY_DQ_BITSLIP_ADDR 1
            }
        }

        puts [format "    best bitslip: %d (score %d)" $best_bitslip $best_score]

        # Reset to best bitslip
        mww $CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR 1
        for {set i 0} {$i < $best_bitslip} {incr i} {
            mww $CSR_DDRPHY_RDLY_DQ_BITSLIP_ADDR 1
        }

        # Center delay in working window
        center_module $module
    }

    dfii_hw_control
    puts "--- READ LEVELING COMPLETE ---"
}

# 7. INITIALIZATION SEQUENCE
# ------------------------------------------------------------------------------
proc init_sequence {} {
    global CSR_DFII_CONTROL_ADDR CSR_DDRCTRL_INIT_DONE_ADDR
    global CSR_DDRCTRL_INIT_ERROR_ADDR
    global CSR_DDRPHY_RST_ADDR CSR_DDRPHY_RDPHASE_ADDR CSR_DDRPHY_WRPHASE_ADDR
    global CSR_DDRPHY_DLY_SEL_ADDR
    global CSR_DDRPHY_RDLY_DQ_RST_ADDR CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR
    global DFII_CONTROL_SEL DFII_CONTROL_CKE DFII_CONTROL_ODT DFII_CONTROL_RESET_N
    global CMD_PRECHARGE CMD_LMR CMD_REFRESH CMD_ZQCAL
    global NUM_MODULES

    puts "DRAM PHY INIT: Reset read and write phases"
    mww $CSR_DDRPHY_RDPHASE_ADDR 2
    mww $CSR_DDRPHY_WRPHASE_ADDR 3

    puts "DRAM PHY INIT: Reset delays and bitslips"
    for {set i 0} {$i < $NUM_MODULES} {incr i} {
        mww $CSR_DDRPHY_DLY_SEL_ADDR [expr {1 << $i}]
        mww $CSR_DDRPHY_RDLY_DQ_RST_ADDR 1
        mww $CSR_DDRPHY_RDLY_DQ_BITSLIP_RST_ADDR 1
    }

    puts "DRAM INIT: Switch DFII to software control"
    set val [expr {$DFII_CONTROL_CKE | $DFII_CONTROL_ODT | $DFII_CONTROL_RESET_N}]
    mww $CSR_DFII_CONTROL_ADDR $val

    puts "DRAM INIT: Reset PHY"
    mww $CSR_DDRPHY_RST_ADDR 1
    sleep 1
    mww $CSR_DDRPHY_RST_ADDR 0
    sleep 1

    puts "DRAM INIT: Reset init and error flags"
    mww $CSR_DDRCTRL_INIT_DONE_ADDR 0
    mww $CSR_DDRCTRL_INIT_ERROR_ADDR 0

    puts "DRAM INIT: Bring CKE high"
    write_addr 0x0
    write_baddr 0
    set val [expr {$DFII_CONTROL_CKE | $DFII_CONTROL_ODT | $DFII_CONTROL_RESET_N}]
    mww $CSR_DFII_CONTROL_ADDR $val
    sleep 20 ;# cdelay(20000)

    puts "DRAM INIT: Load Mode Register 2, CWL=5"
    write_addr 0x200
    write_baddr 2
    command_p0 $CMD_LMR

    puts "DRAM INIT: Load Mode Register 3"
    write_addr 0x0
    write_baddr 3
    command_p0 $CMD_LMR

    puts "DRAM INIT: Load Mode Register 1"
    write_addr 0x6
    write_baddr 1
    command_p0 $CMD_LMR

    puts "DRAM INIT: Load Mode Register 0, CL=7, BL=8"
    write_addr 0x930
    write_baddr 0
    command_p0 $CMD_LMR
    sleep 1

    puts "DRAM INIT: ZQ Calibration"
    write_addr 0x400
    write_baddr 0
    command_p0 $CMD_ZQCAL
    sleep 1

    puts "DRAM INIT: Switch DFII to Hardware Control"
    mww $CSR_DFII_CONTROL_ADDR $DFII_CONTROL_SEL

    puts "DRAM INIT: Set Init Done Flag"
    mww $CSR_DDRCTRL_INIT_DONE_ADDR 1

    puts "--- DRAM INIT COMPLETE ---"
}

init_sequence
read_leveling
